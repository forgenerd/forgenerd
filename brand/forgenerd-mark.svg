<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 26 368 368">
  <title>forgenerd</title>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc21c"/>
      <stop offset="1" stop-color="#f29e00"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb20c"/>
      <stop offset="1" stop-color="#ffc828"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd630"/>
      <stop offset=".35" stop-color="#ffb70c"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c47406"/>
      <stop offset=".12" stop-color="#ee9a03" stop-opacity="0"/>
      <stop offset=".88" stop-color="#ee9a03" stop-opacity="0"/>
      <stop offset="1" stop-color="#c47406"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e9f0"/>
    </linearGradient>
  </defs>

  <!-- horns -->
  <path d="M120 128H42c-12 0-18 6-14 14 16 30 52 50 92 58z" fill="url(#horn)"/>
  <path d="M280 128h86c12 0 16 6 12 13-16 29-50 49-98 57z" fill="url(#horn)"/>
  <path d="M42 131h78M280 131h84" stroke="#ffe866" stroke-width="4" stroke-linecap="round"/>

  <!-- waist and base -->
  <path d="M136 220h132c2 24 14 42 30 50v18H106v-18c16-8 28-26 30-50z" fill="url(#face)"/>
  <path d="M136 220h132c2 24 14 42 30 50v18H106v-18c16-8 28-26 30-50z" fill="url(#side)"/>
  <rect x="106" y="282" width="196" height="36" rx="6" fill="#f4a000"/>
  <rect x="106" y="282" width="196" height="36" rx="6" fill="url(#side)"/>
  <path d="M110 286h188" stroke="#ffd34a" stroke-width="5" stroke-linecap="round"/>
  <path d="M112 316h184" stroke="#c97c00" stroke-width="4" stroke-linecap="round"/>
  <rect x="184" y="258" width="40" height="6" rx="2" fill="#733e00"/>

  <!-- top block -->
  <rect x="104" y="132" width="196" height="50" rx="4" fill="url(#face)"/>
  <rect x="104" y="132" width="196" height="50" rx="4" fill="url(#side)"/>
  <path d="M112 102h180l8 34H104z" fill="url(#top)"/>
  <path d="M106 137h192" stroke="#ffe856" stroke-width="6" stroke-linecap="round"/>
  <rect x="138" y="111" width="24" height="15" rx="2" fill="#985401"/>
  <rect x="141" y="114" width="18" height="9" rx="1" fill="#6e3a00"/>

  <!-- glasses -->
  <g fill="#2b2726">
    <rect x="100" y="173" width="24" height="22" rx="3"/>
    <rect x="284" y="173" width="24" height="22" rx="3"/>
    <rect x="112" y="173" width="82" height="60" rx="8"/>
    <rect x="214" y="173" width="82" height="60" rx="8"/>
    <rect x="190" y="193" width="28" height="11" rx="2"/>
  </g>
  <rect x="104" y="177" width="9" height="9" rx="1" fill="#eef1f5"/>
  <rect x="295" y="177" width="9" height="9" rx="1" fill="#eef1f5"/>
  <rect x="123" y="185" width="60" height="36" rx="4" fill="url(#lens)"/>
  <rect x="225" y="185" width="60" height="36" rx="4" fill="url(#lens)"/>
</svg>
