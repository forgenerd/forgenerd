id: mysql
name: MySQL
description: MySQL 8.4 LTS with a persistent volume. Other apps connect at <app-name>:3306.
service: mysql
port: 3306
image: mysql
image_tag: '8.4'
env:
  MYSQL_USER: { value: app, description: Application database user, secret: false }
  MYSQL_DATABASE: { value: app, description: Application database name, secret: false }
  MYSQL_PASSWORD: { description: Password for the application user, generate: true }
  MYSQL_ROOT_PASSWORD: { description: Password for the MySQL root account, generate: true }
connection: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@{host}:3306/${MYSQL_DATABASE}
compose: |
  services:
    mysql:
      image: mysql:${IMAGE_TAG}
      environment:
        MYSQL_USER: ${MYSQL_USER}
        MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        MYSQL_DATABASE: ${MYSQL_DATABASE}
        MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      volumes:
        - data:/var/lib/mysql
      healthcheck:
        test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
        interval: 5s
        timeout: 3s
        retries: 30
        start_period: 20s
  volumes:
    data:
