id: redis
name: Redis
description: Redis 7 with append-only persistence and a password. Other apps connect at <app-name>:6379.
service: redis
port: 6379
image: redis
image_tag: 7-alpine
env:
  REDIS_PASSWORD: { description: Password required by Redis clients, generate: true }
connection: redis://default:${REDIS_PASSWORD}@{host}:6379
compose: |
  services:
    redis:
      image: redis:${IMAGE_TAG}
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
      environment:
        REDISCLI_AUTH: ${REDIS_PASSWORD}
      volumes:
        - data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 5s
        timeout: 3s
        retries: 20
  volumes:
    data:
