name: Release

# Push a tag like v0.1.0 to build static musl binaries and publish a GitHub release
# with SHA256SUMS (the format scripts/install.sh verifies).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # Zig is the C compiler/linker for the bundled SQLite and aws-lc (rustls) sources,
      # which makes both musl targets static without musl-gcc or a cross sysroot.
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Build static binary
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Check the binary is static
        run: |
          bin=target/${{ matrix.target }}/release/forgenerd
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
      - name: Smoke test (x86_64 only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/${{ matrix.target }}/release/forgenerd --version
      - run: cp target/${{ matrix.target }}/release/forgenerd forgenerd-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: forgenerd-${{ matrix.target }}
          path: forgenerd-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: forgenerd-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum forgenerd-* > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* scripts/install.sh \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
